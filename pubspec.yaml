name: recipedia
description: Find recipes from the ingredients you already have.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # backend
  flutter_svg: ^2.0.0
  supabase_flutter: ^2.5.0

  # state / navigation
  get: ^4.6.6

  # media
  cached_network_image: ^3.4.0
  image_picker: ^1.1.0
  path: ^1.9.0

  # sharing (FR11)
  share_plus: ^13.2.0

  # offline cache (FR19)
  shared_preferences: ^2.5.0

  # NOTE: add when the scan model ships (C5 — on-device TFLite)
  # tflite_flutter: ^0.11.0
  #
  # NOTE: add when push notifications are implemented (FR6, P1)
  # firebase_core: ^3.0.0
  # firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Inter 18pt: the optical size cut for text between 11 and 16px, which is
    # everything this app sets in Inter — body, labels, captions, admin tables.
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
    # Display only: screen titles and recipe titles. Deliberately no regular
    # weight — this face is never used for body copy.
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  assets:
    - assets/ing/

  # Uncomment when the trained model is added:
  #   - assets/ml/
