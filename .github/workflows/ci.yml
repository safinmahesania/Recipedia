name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The gate that matters. This is the step that catches the "X not found"
      # class of error that has bitten this project repeatedly — a file edited
      # locally, referenced elsewhere, and pushed without building.
      # The gate that matters. `flutter analyze` fails on any issue, including
      # info-level lints. The codebase currently sits at zero, so keeping it
      # strict holds that line rather than letting lint debt accumulate.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Formatting is reported but never fails the build. Reformatting 7,800
      # lines in one commit would bury every real diff in review noise.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only on the default branch — a full Android build is slow and adds
    # nothing on feature branches that analyze already covers.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Supabase config is injected the same way as locally. The publishable
      # key is safe to expose — RLS is what protects the data — but keeping it
      # in Actions secrets avoids committing it and makes rotation one click.
      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: recipedia-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
